name: usa-limousine-corporation

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../../apps/backend/.env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usa_limo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-usa_limousine_corporation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usa_limo} -d ${POSTGRES_DB:-usa_limousine_corporation}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - usa_limo

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - usa_limo

  backend:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../apps/backend/.env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-usa_limo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-usa_limousine_corporation}?schema=public&connection_limit=10&pool_timeout=20
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PUBLISH_HOST:-127.0.0.1}:${API_PUBLISH_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - usa_limo

  admin:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.usalimocorp.com/api/v1
        NEXT_PUBLIC_APP_URL: https://admin.usalimocorp.com
        NEXT_PUBLIC_APP_ENV: production
        # Inlined at Next build time; value from apps/admin/.env.production on the VPS
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    env_file:
      - ../../apps/admin/.env.production
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/auth/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - usa_limo

  customer:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.customer
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.usalimocorp.com/api/v1
        NEXT_PUBLIC_APP_URL: https://customer.usalimocorp.com
        NEXT_PUBLIC_APP_ENV: production
        # Inlined at Next build time (booking route map); value from the env files on the VPS
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    env_file:
      - ../../apps/customer/.env.production
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3002"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/auth/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - usa_limo

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      admin:
        condition: service_healthy
      customer:
        condition: service_healthy
    networks:
      - usa_limo

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  usa_limo:
    driver: bridge
